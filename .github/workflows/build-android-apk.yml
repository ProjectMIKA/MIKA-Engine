name: Build Standalone Android APK & Native Desktop Overlay Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach platform builds to (e.g. v1.1.1)'
        required: false
        default: 'v1.1.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MIKA Engine
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build single-file web bundle
        run: |
          npm install
          npm test
          npm run build

      - name: Compile & Sign Standalone Android Overlay APK
        run: |
          chmod +x android/build-apk.sh
          ./android/build-apk.sh

      - name: Package Native Windows & Linux Always-On-Top Electron Overlays
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npm install --no-save electron @electron/packager
          # Temporarily omit "type": "module" so Electron loads electron/main.cjs cleanly in packaged app
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete p.type;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
          '
          npx @electron/packager . MIKA-Engine \
            --platform=win32 \
            --arch=x64 \
            --electron-version=33.2.0 \
            --out=builds/native \
            --overwrite \
            --ignore="^/(src|tests|android|builds|\\.git|\\.github|node_modules)"
          npx @electron/packager . MIKA-Engine \
            --platform=linux \
            --arch=x64 \
            --electron-version=33.2.0 \
            --out=builds/native \
            --overwrite \
            --ignore="^/(src|tests|android|builds|\\.git|\\.github|node_modules)"
          git checkout -- package.json

          (
            cd builds/native/MIKA-Engine-win32-x64
            zip -q -r "../../MIKA-Engine_V${VERSION}_Windows.zip" .
          )
          (
            cd builds/native/MIKA-Engine-linux-x64
            zip -q -r "../../MIKA-Engine_V${VERSION}_Linux.zip" .
          )
          ls -lh builds/MIKA-Engine_V${VERSION}_*.zip builds/MIKA-Engine_V${VERSION}_Android.apk

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MIKA-Engine-Platform-Builds
          path: |
            builds/MIKA-Engine_V*_Android.apk
            builds/MIKA-Engine_V*_Windows.zip
            builds/MIKA-Engine_V*_Linux.zip
            builds/MIKA-Engine_V*_Android.zip
            builds/MIKA-Engine_V*_Standalone.zip

      - name: Attach All Platform Builds to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${VERSION}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            for f in \
              "builds/MIKA-Engine_V${VERSION}_Android.apk" \
              "builds/MIKA-Engine_V${VERSION}_Windows.zip" \
              "builds/MIKA-Engine_V${VERSION}_Linux.zip" \
              "builds/MIKA-Engine_V${VERSION}_Android.zip" \
              "builds/MIKA-Engine_V${VERSION}_Standalone.zip"; do
              echo "Uploading $f to $TAG..."
              gh release upload "$TAG" "$f" --clobber
            done
          fi
