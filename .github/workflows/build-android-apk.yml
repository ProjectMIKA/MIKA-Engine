name: Build Standalone Android APK & Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach APK to (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MIKA Engine
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build single-file web bundle
        run: |
          npm install
          npm test
          npm run build

      - name: Compile & Sign Standalone Android APK
        run: |
          chmod +x android/build-apk.sh
          ./android/build-apk.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIKA-Engine-Android-APK
          path: builds/MIKA-Engine_V*_Android.apk

      - name: Attach Standalone Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${VERSION}"
          fi
          APK_FILE="builds/MIKA-Engine_V${VERSION}_Android.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${APK_FILE}#MIKA-Engine_V${VERSION}_Android.apk (Standalone Android APK)" --clobber
          fi
